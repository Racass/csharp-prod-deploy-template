name: entrega

on:
  push:
    branches: [main, gabarito, aula09-ia]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Testes da loja
        run: dotnet test LojaProducao.slnx -c Release --verbosity quiet

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Namespace e versao
        id: image
        shell: bash
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: LojaGraphQL.Api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/web:${{ steps.image.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publicar worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: LojaGraphQL.Worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/worker:${{ steps.image.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publicar assistente
        uses: docker/build-push-action@v6
        with:
          context: .
          file: LojaGraphQL.Assistente/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/assistente:${{ steps.image.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Versao para o deploy local
        run: echo "Namespace ${{ github.repository }} — versao ${{ steps.image.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
